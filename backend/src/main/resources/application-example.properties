# ==========================================================
# NLIC Connect - Example Application Configuration
# Copy this file to application.properties and provide
# local database credentials before running the backend.
# ==========================================================

spring.application.name=nlic-connect-backend

spring.datasource.url=jdbc:mysql://localhost:3306/nlic_connect?useSSL=false&serverTimezone=America/New_York
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080